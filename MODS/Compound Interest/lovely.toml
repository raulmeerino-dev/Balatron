[manifest]
version = "1.0.0"
priority = 20
dump_lua = false

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME = saveTable and saveTable.GAME or self:init_game_object()"
position = "after"
match_indent = true
payload = "if IncJoker then IncJoker.begin_run(saveTable ~= nil) end"

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local card = SMODS.create_card(create_flags)"
position = "at"
match_indent = true
payload = '''
if not (create_flags.key or create_flags.rarity or create_flags.legendary) then
    create_flags.key = IncJoker and IncJoker.shop_offer(create_flags.set, area)
end
local card = SMODS.create_card(create_flags)
'''

# Native save_run already persists every G CardArea. Instantiate this private
# deck before the native loader rebuilds the physical playing-card roster.
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "local cardAreas = saveTable.cardAreas"
position = "before"
match_indent = true
payload = "require('expansion48.jokers').reserve_area()"

# Steamodded's scoring patches run first (priority -10). Commit Pendulum once
# after all scoring effects, before any score/record/cash-out consumer.
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = "(?m)^[ \\t]*check_and_set_high_score\\('hand',\\s*SMODS.calculate_round_score\\(\\)\\s*\\)"
position = "before"
payload = "require('expansion48.jokers').final_score()\n"

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "local chosen_joker = pseudorandom_element(G.jokers.cards, pseudoseed('ankh_choice'))"
position = "at"
match_indent = true
payload = "local chosen_joker = pseudorandom_element(require('expansion48.jokers').copy_candidates(G.jokers.cards), pseudoseed('ankh_choice'))"

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''if G.jokers.cards[i] ~= self then
    jokers[#jokers+1] = G.jokers.cards[i]
end'''
position = "at"
match_indent = true
payload = '''if G.jokers.cards[i] ~= self and PortraitExpansion48.can_copy(G.jokers.cards[i]) then
    jokers[#jokers+1] = G.jokers.cards[i]
end'''
